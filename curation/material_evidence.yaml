# Hand-transcribed scientific measurements (E0-derived facts, transcribed by a human from the cited source).
# Every row cites source_id + locator (page/table) so it can be re-checked against the evidence file.
# `folio_ref` is the sample location exactly as the source writes it. `page_id` is only filled where the
# mapping to an IVTFF page name is unambiguous; foldout panels the source does not specify stay null.
# Interpretive conclusions of the authors are recorded in `source_conclusion`, separately from constituents.

transcribed_by: Claude (claude-opus-5-5), 2026-10-01, from evidence files listed per row
review_status: unreviewed

