  source_conclusions:
    - {locator: "p.5", text: "In all probability, the ink used for the text is the same as that used for the drawings; both are iron gall inks."}
    - {locator: "p.5", text: "The page-number ink, the quire ink, and the ink of the Latin alphabet on 1R are all different from the text/drawing ink and from one another."}
    - {locator: "p.5", text: "The blue paint is ground azurite."}
    - {locator: "p.6", text: "The green paint is copper-stained amorphous organic material consistent with copper resinate, plus copper-chloride compounds consistent with atacamite; no resins identified."}
    - {locator: "p.6", text: "The binding medium for all inks and the green paint is gum; binder for Sample 20 undetermined."}
    - {locator: "p.3", text: "One example found in which paint was clearly over the writing (Figure 7A)."}
    - {locator: "p.1", text: "UV examination of folio 1R revealed a signature, probably that of Jacobj a Tepenece; other undeciphered writing also seen; blotchiness consistent with chemical staining."}

