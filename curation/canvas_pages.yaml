# Curated correspondences between Yale IIIF canvases (by manifest sequence number) and IVTFF page names.
# Canvases whose Yale label is a plain folio side ("1r", "57v") are mapped automatically (method=label_exact)
# and must NOT be listed here. Everything listed here overrides the automatic rule for that canvas.
#
# role:
#   whole    the page occupies (essentially) the whole canvas
#   part     the page is one panel of a multi-panel canvas; region_xywh (pixels on the full-size canvas)
#            gives an approximate panel box when known
#   partial  the canvas shows only part of the page (Yale photographed a foldout panel in pieces)
# x_frac: [left, right] horizontal extent of the panel as a fraction of canvas width (full height assumed).
#         Estimated by eye from decile-ticked previews at fold creases; expect +-3% error. Converted to
#         region_xywh pixels by the builder.
# Evidence used besides the image: Archetype (Timm 2026) image labels, which match canvases by exact
# pixel size, and ZL3b line counts / page comments per page.

curated_by: Claude (claude-opus-5-5), 2026-10-01; review_status unreviewed

binding:
  1: front_cover
  2: inside_front_cover
  207: back_flyleaf_recto
  208: back_flyleaf_verso_inside_back_cover
  209: edge_head
  210: edge_tail
  211: edge_fore
  212: spine
  213: back_cover

