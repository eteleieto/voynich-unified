# Voynich Unified Dataset — source registry (E0 catalog)
#
# Every row in every built table must trace back to one or more source_ids here.
# Rules:
#   * A source is a specific *version* of something. New version => new source_id.
#     Never edit the files of an existing source; add a new entry instead.
#   * `acquisition`:
#       auto        – `vud fetch` downloads it; sha256 recorded in evidence/MANIFEST.tsv
#       iiif        – `vud fetch` walks a IIIF manifest and downloads every canvas image
#       manual      – must be placed in evidence/<source_id>/ by hand (instructions in notes)
#       registered  – known to exist, raw data not (yet) obtainable; kept so absence is explicit
#       deferred    – large external corpus; schema exists, ingestion is a later phase
#   * `layer`: E0 raw evidence | E2 scholarly annotation | H hypothesis | LIT literature | CMP comparator
#   * `files[].path` is relative to evidence/<source_id>/

sources:

  # ------------------------------------------------------------------ images
  - source_id: yale_ms408_iiif_2014
    name: Beinecke MS 408 complete digital surrogate (IIIF)
    creator: Beinecke Rare Book & Manuscript Library, Yale University
    version: "manifest as retrieved"
    layer: E0
    kind: image_set
    acquisition: iiif
    canonical_location: https://collections.library.yale.edu/catalog/2002046
    manifest_url: https://collections.library.yale.edu/manifests/2002046
    license: "Yale Library Open Access (public-domain object); attribution: Beinecke Rare Book & Manuscript Library"
    files:
      - {url: "https://collections.library.yale.edu/manifests/2002046", path: iiif-manifest.json}
      - {url: "https://collections.library.yale.edu/catalog/oai?verb=GetRecord&metadataPrefix=oai_mods&identifier=oai:collections.library.yale.edu:2002046", path: mods.xml}
    notes: >
      213 canvases (covers, flyleaves, edges, all folios incl. foldout panels as Yale photographed them).
      Masters are the IIIF 'full/full' JPEGs, which are the largest public derivatives; Yale's archival
      TIFFs are not separately exposed. Images are stored byte-for-byte as served; never resized or cropped.

