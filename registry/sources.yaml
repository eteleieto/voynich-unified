    notes: >
      1,684 glyph ('graph') polygons on 203 Yale images, with allograph (iin/in/k/sh/weirdos) and hand labels.
      Hand labels follow Davis's section-based 5-scribe model, which the dataset's author argues AGAINST —
      treat hand labels as one authority's assignment, not ground truth. Image dimensions match Yale IIIF full
      size exactly, so geometry registers directly onto yale_ms408_iiif_2014 canvases. The 1.9 GB image tarball
      is intentionally not fetched (duplicates Yale masters).

