      - {url: "https://www.voynich.nu/data/sta/RF1b.txt", path: RF1b.txt}
      - {url: "https://www.voynich.nu/data/sta/VT0e.txt", path: VT0e.txt}
      - {url: "https://www.voynich.nu/data/sta/STA1-basic.pdf", path: STA1-basic.pdf}
    notes: >
      The author-sanctioned common alphabet: every glyph is a 2-character STA code (family letter + member).
      This is THE way to compare Currier, FSG, v101 and EVA witnesses character-by-character. _0/_1 are STA
      'regularisation levels' 0 and 1. VT0e is listed only as "VT STA level 0" (IVTFF source number 4,
      database-generated); its provenance is otherwise undocumented on the page. Empirically it is 97.9%
      token-identical to IT2a (derived.witness_agreement, common_basic_eva), i.e. a Takahashi-derived witness.

