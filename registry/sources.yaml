  - source_id: archetype_timm_2026
    name: "Archetype: Voynich Palaeography (database dump)"
    creator: Torsten Timm
    version: "v1, 2026-03-01 (Zenodo 10.5281/zenodo.18827108)"
    layer: E2
    kind: annotation_db
    acquisition: auto
    canonical_location: https://zenodo.org/records/18827108
    license: CC BY 4.0 (annotations); images subject to Beinecke terms
    files:
      - {url: "https://zenodo.org/api/records/18827108/files/README.md/content", path: README.md, md5: ffd4b907ed288f4a90d6db081a213721}
      - {url: "https://zenodo.org/api/records/18827108/files/archetype-voynich-palaeography-project.tar.gz/content", path: archetype-voynich-palaeography-project.tar.gz, md5: 9b19b4ebe0384bb78c440e64a23e90ff}
    notes: >
      1,684 glyph ('graph') polygons on 203 Yale images, with allograph (iin/in/k/sh/weirdos) and hand labels.
      Hand labels follow Davis's section-based 5-scribe model, which the dataset's author argues AGAINST —
      treat hand labels as one authority's assignment, not ground truth. Image dimensions match Yale IIIF full
      size exactly, so geometry registers directly onto yale_ms408_iiif_2014 canvases. The 1.9 GB image tarball
      is intentionally not fetched (duplicates Yale masters).

