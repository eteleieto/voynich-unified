[project]
name = "vud"
version = "0.1.0"
description = "Voynich Unified Dataset: provenance-first evidence workspace for Beinecke MS 408"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1",
  "pyarrow>=17",
  "pyyaml>=6",
  "requests>=2.32",
  "pillow>=10",
  "numpy>=1.26",
  "pytest>=8",
  "pypdf>=4",
  "rapidfuzz>=3.14.6",
  "opencv-python-headless>=5.0.0.93",
  "scipy>=1.17.1",
]

[project.scripts]
vud = "vud.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vud"]

[tool.pytest.ini_options]
testpaths = ["tests"]
